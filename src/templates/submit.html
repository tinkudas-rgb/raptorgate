{% extends "layout.html" %}
{% block title %}Submit - RaptorGate{% endblock %}
{% block content %}
<h1>Submit to {{ event['name'] }}</h1>
{% if not open %}
<p class="error">Submissions closed at {{ event['submissions_close'] }}.</p>
{% else %}
<form method="post" class="stack">
  <label>Title <input name="title" required></label>
  <label>Summary <textarea name="summary" rows="4"></textarea></label>
  <label>Repo URL <input type="url" name="repo_url"></label>
  <label>Track
    <select name="track_id">
      {% for t in tracks %}<option value="{{ t['id'] }}">{{ t['name'] }}</option>{% endfor %}
    </select>
  </label>
  <button type="submit" name="action" value="draft">Save draft</button>
  <button type="submit" name="action" value="submit">Submit</button>
</form>
{% endif %}
{% endblock %}

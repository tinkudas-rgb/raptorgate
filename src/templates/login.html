{% extends "layout.html" %}
{% block title %}Log in - RaptorGate{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="stack">
  <label>Email <input type="email" name="email" required></label>
  <label>Password <input type="password" name="password" required></label>
  <button type="submit">Log in</button>
</form>
<p class="meta">Seeded demo accounts: organizer@example.org / organizer123,
priya1@example.org / participant123, any fixture judge email / judge123.</p>
{% endblock %}
